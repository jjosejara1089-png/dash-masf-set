<style>

/* =========================================================
   VARIABLES
========================================================= */

:root{

    --navy:#0b4268;
    --navy-dark:#083957;

    --blue:#168bd0;
    --blue-light:#8bc7ee;

    --green:#10a66a;
    --green-dark:#07804e;

    --card:#ffffff;

/* =========================================================

========================================================= */

*{

}


body{

/* =========================================================

========================================================= */

.app{

}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

}


.logo{

.logo small{

/* =========================================================

========================================================= */

========================================================= */

.table-scroll{

}


table{

}


thead th{

}

tbody td{

.total-row{

.bad{

/* =========================================================

========================================================= */

.grid{

.chart{

    height:320px;

}


.chart canvas{

/* =========================================================

========================================================= */

}

/* =========================================================

========================================================= */

<script>


/* =========================================================
   VARIABLES GLOBALES
========================================================= */

let DATA = [];

let HEADERS = [];

let CHARTS = {};


/* =========================================================
   COLUMNAS
========================================================= */

const COL = {};


/* =========================================================
   NORMALIZACIÓN
========================================================= */

function normalizar(valor){

    return String(
        valor ?? ""
    )
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .trim()
    .toUpperCase()
    .replace(
        /\s+/g,
        "_"
    );

}


function texto(valor){

    return String(
        valor ?? ""
    ).trim();

}


function numero(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return 0;

    }

    if(
        typeof valor === "number"
    ){

        return isFinite(valor)
            ? valor
            : 0;

    }

    let s =
        String(valor)
        .trim();

    s =
        s.replace(
            /\$/g,
            ""
        )
        .replace(
            /,/g,
            ""
        );

    const n =
        Number(s);

    return isFinite(n)
        ? n
        : 0;

}


/* =========================================================
   FECHAS EXCEL
========================================================= */

function convertirFecha(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return null;

    }


    if(
        valor instanceof Date
    ){

        return isNaN(valor.getTime())
            ? null
            : valor;

    }


    if(
        typeof valor === "number"
        &&
        window.XLSX
        &&
        XLSX.SSF
        &&
        XLSX.SSF.parse_date_code
    ){

        const d =
            XLSX.SSF.parse_date_code(
                valor
            );

        if(d){

            return new Date(
                d.y,
                d.m - 1,
                d.d,
                d.H || 0,
                d.M || 0,
                d.S || 0
            );

        }

    }


    const s =
        String(valor)
        .trim();


    let d =
        new Date(s);


    if(
        !isNaN(d.getTime())
    ){

        return d;

    }


    const m =
        s.match(
            /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
        );


    if(m){

        return new Date(
            Number(m[3]),
            Number(m[2]) - 1,
            Number(m[1])
        );

    }


    return null;

}


function fechaSolo(valor){

    const d =
        convertirFecha(
            valor
        );

    if(!d){

        return null;

    }

    return new Date(
        d.getFullYear(),
        d.getMonth(),
        d.getDate()
    );

}


/* =========================================================
   FORMATO
========================================================= */

function dinero(valor){

    return new Intl.NumberFormat(
        "en-US",
        {
            style:"currency",
            currency:"USD",
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    )
    .format(
        numero(valor)
    );

}


function entero(valor){

    return new Intl.NumberFormat(
        "en-US",
        {
            maximumFractionDigits:0
        }
    )
    .format(
        numero(valor)
    );

}


function porcentaje(valor){

    return numero(valor).toFixed(1) + "%";

}


function escapeHTML(valor){

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   BUSCAR COLUMNA
========================================================= */

function buscarColumna(lista){

    const buscadas =
        lista.map(
            normalizar
        );


    const mapa =
        HEADERS.map(
            h => ({
                original:h,
                clave:normalizar(h)
            })
        );


    for(
        const buscada of buscadas
    ){

        const encontrada =
            mapa.find(
                x =>
                    x.clave === buscada
            );


        if(encontrada){

            return encontrada.original;

        }

    }


    return null;

}


/* =========================================================
   CONSTRUIR MAPA
========================================================= */

function construirMapa(){

    COL.OP =
        buscarColumna([
            "OPERACION"
        ]);


    COL.CARTERA =
        buscarColumna([
            "CUOTA_DOLARIZADA"
        ]);


    COL.RECUPERADO =
        buscarColumna([
            "MONTO_PAGO_DOLARIZADO"
        ]);


    COL.SOCIO =
        buscarColumna([
            "UNICO_SOCIO"
        ]);


    COL.MES =
        buscarColumna([
            "MES"
        ]);


    COL.CICLO =
        buscarColumna([
            "CICLO2",
            "CICLO"
        ]);


    COL.TRAMO =
        buscarColumna([
            "TRAMO"
        ]);


    COL.ASESOR =
        buscarColumna([
            "ASESOR_ASIGN",
            "ASESOR"
        ]);


    COL.SBS =
        buscarColumna([
            "CALIFICACION_SBS"
        ]);


    COL.PAGO =
        buscarColumna([
            "RESPP"
        ]);


    COL.TIPO =
        buscarColumna([
            "TIPO_CUOTA"
        ]);


    COL.FLAG_PROMESA =
        buscarColumna([
            "FLAG_PROMESA"
        ]);


    COL.FLAG_SEGUIMIENTO =
        buscarColumna([
            "FLAG_SEGUIMIENTO"
        ]);


    COL.CONTACTO =
        buscarColumna([
            "CONTACTO"
        ]);


    COL.SIN_PAGO =
        buscarColumna([
            "SIN_PAGO",
            "SIN PAGO"
        ]);


    COL.GEST_CALL =
        buscarColumna([
            "CANT_GEST_CALL"
        ]);


    COL.PROMESA_CALL =
        buscarColumna([
            "CANT_PROMESA_CALL"
        ]);


    COL.CONTAC_CALL =
        buscarColumna([
            "CANT_CONTAC_CALL"
        ]);


    COL.GEST_IVR =
        buscarColumna([
            "CANT_GEST_IVR"
        ]);


    COL.GEST_EMAIL =
        buscarColumna([
            "CANT_GEST_EMAIL"
        ]);


    COL.GEST_SMS =
        buscarColumna([
            "CANT_GEST_SMS"
        ]);


    COL.FECHA_PAGO =
        buscarColumna([
            "FECHA_PAGO"
        ]);


    COL.FEC_COMPROMISO =
        buscarColumna([
            "MEJOR_FEC_COMPROMISO"
        ]);

}


/* =========================================================
   VALOR COLUMNA
========================================================= */

function valorCampo(
    row,
    campo
){

    if(!campo){

        return "";

    }

    return row[campo];

}


/* =========================================================
   OBTENER VALORES ÚNICOS
========================================================= */

function valoresUnicos(
    campo
){

    if(!campo){

        return [];

    }


    return [
        ...new Set(
            DATA
            .map(
                r =>
                    texto(
                        r[campo]
                    )
            )
            .filter(
                v => v !== ""
            )
        )
    ]
    .sort(
        (a,b) =>
            a.localeCompare(
                b,
                "es",
                {
                    numeric:true
                }
            )
    );

}


/* =========================================================
   CARGAR SELECT
========================================================= */

function cargarSelect(
    id,
    valores
){

    const el =
        document.getElementById(
            id
        );


    if(!el){

        return;

    }


    el.innerHTML =
        `<option value="__ALL__">
            Todos
        </option>`;


    valores.forEach(
        v => {

            const op =
                document.createElement(
                    "option"
                );

            op.value = v;

            op.textContent = v;

            el.appendChild(op);

        }
    );

}


/* =========================================================
   CARGAR FILTROS
========================================================= */

function cargarFiltros(){

    cargarSelect(
        "fMes",
        valoresUnicos(
            COL.MES
        )
    );


    cargarSelect(
        "fCiclo",
        valoresUnicos(
            COL.CICLO
        )
    );


    cargarSelect(
        "fTramo",
        valoresUnicos(
            COL.TRAMO
        )
    );


    cargarSelect(
        "fAsesor",
        valoresUnicos(
            COL.ASESOR
        )
    );


    cargarSelect(
        "fSbs",
        valoresUnicos(
            COL.SBS
        )
    );


    cargarSelect(
        "fPago",
        valoresUnicos(
            COL.PAGO
        )
    );


    cargarSelect(
        "fTipo",
        valoresUnicos(
            COL.TIPO
        )
    );

}


/* =========================================================
   FILTRADO
========================================================= */

function obtenerFiltrados(){

    const fMes =
        document
        .getElementById(
            "fMes"
        )
        .value;


    const fCiclo =
        document
        .getElementById(
            "fCiclo"
        )
        .value;


    const fTramo =
        document

/* =========================================================
   PROMESA CUMPLIDA
========================================================= */

function promesaCumplida(row){

    const flag =
        numero(
            row[COL.FLAG_PROMESA]
        );


    if(
        flag !== 1
    ){

        return false;

    }


    const pago =
        numero(
            row[COL.RECUPERADO]
        );


    if(
        pago <= 0
    ){

        return false;

    }


    const fechaPago =
        fechaSolo(
            row[COL.FECHA_PAGO]
        );


    const fechaCompromiso =
        fechaSolo(
            row[COL.FEC_COMPROMISO]
        );


    /*
       Si ambas fechas existen:
       pago debe ocurrir en o después
       de la fecha comprometida.
    */

    if(
        fechaPago &&
        fechaCompromiso
    ){

        return (
            fechaPago.getTime()
            >=
            fechaCompromiso.getTime()
        );

    }


    /*
       Si no existe fecha de compromiso,
       pero existe pago, no se fuerza
       una validación temporal.
    */

    return true;

}


/* =========================================================
   MÉTRICAS
========================================================= */

function calcularMetricas(rows){

    let cartera = 0;

    let recuperado = 0;

    let qOperation = 0;

    let qUnico = 0;

    let qConPago = 0;

    let qSinPago = 0;

    let promesas = 0;

    let montoPromesas = 0;

    let promesasCumplidas = 0;


    rows.forEach(
        row => {

            const op =
                texto(
                    row[COL.OP]
                );


            if(
                op !== ""
            ){

                qOperation++;

            }


            qUnico +=
                numero(
                    row[COL.SOCIO]
                );


            cartera +=
                numero(
                    row[COL.CARTERA]
                );


            const pago =
                numero(
                    row[COL.RECUPERADO]
                );


            recuperado +=
                pago;


            if(
                pago > 0
            ){

                qConPago++;

            }
            else{

                qSinPago++;

            }


            /*
               Q PROMESAS
            */

            const flagPromesa =
                numero(
                    row[
                        COL.FLAG_PROMESA
                    ]
                );


            if(
                flagPromesa === 1
            ){

                promesas++;

                /*
                   MONTO PROMESAS
                   solamente FLAG_PROMESA = 1
                */

                montoPromesas +=
                    numero(
                        row[
                            COL.RECUPERADO
                        ]
                    );


                /*
                   EFECTIVIDAD PDP
                */

                if(
                    promesaCumplida(
                        row
                    )
                ){

                    promesasCumplidas++;

                }

            }

        }
    );


    const saldo =
        cartera -
        recuperado;


    const porcentajeRecuperacion =
        cartera > 0
        ?
        recuperado /
        cartera *
        100
        :
        0;


    const efectividadPDP =
        promesas > 0
        ?
        promesasCumplidas /
        promesas *
        100
        :
        0;


    return {

        cartera,

        recuperado,

        saldo,

        qOperation,

        qUnico,

        qConPago,

        qSinPago,

        promesas,

        montoPromesas,

        promesasCumplidas,

        efectividadPDP,

        porcentajeRecuperacion

    };

}

/* =========================================================

========================================================= */

function destruirChart(id){

    if(
        CHARTS[id]
    ){

        CHARTS[id].destroy();

        delete CHARTS[id];

    }

}


/* =========================================================
   GRÁFICO DE BARRAS
========================================================= */

function graficoBarras(
    id,
    labels,
    datasets,
    formato
){

    destruirChart(id);


    const canvas =
        document.getElementById(
            id
        );


    if(!canvas){

        return;

    }


    CHARTS[id] =
        new Chart(
            canvas,
            {

                type:"bar",

                data:{

                    labels,

                    datasets

                },


                plugins:[
                    ChartDataLabels
                ],


                options:{

                    responsive:true,

                    maintainAspectRatio:false,

                    layout:{

                        padding:{

                            top:30

                        }

                    },


                    plugins:{

                        legend:{

                            display:true,

                            position:"top"

                        },


                        datalabels:{

                            display:true,

                            anchor:"end",

                            align:"top",

                            offset:2,

                            clamp:true,

                            clip:false,

                            font:{

                                size:9,

                                weight:"800"

                            },


                            formatter:value => {

                                if(
                                    formato ===
                                    "porcentaje"
                                ){

                                    return (
                                        numero(value)
                                        .toFixed(1)
                                        +
                                        "%"
                                    );

                                }


                                if(
                                    formato ===
                                    "dinero"
                                ){

                                    return dinero(
                                        value
                                    );

                                }


                                return entero(
                                    value
                                );

                            }

                        }

                    },


                    scales:{

                        y:{

                            beginAtZero:true,

                            ticks:{

                                callback:value => {

                                    if(
                                        formato ===
                                        "porcentaje"
                                    ){

                                        return (
                                            numero(value)
                                            .toFixed(0)
                                            +
                                            "%"
                                        );

                                    }


                                    if(
                                        formato ===
                                        "dinero"
                                    ){

                                        return dinero(
                                            value
                                        );

                                    }


                                    return entero(
                                        value
                                    );

                                }

                            }

                        }

                    }

                }

            }
        );

}

function renderTramos(rows){

    const configuracion = [

        {

                "PREVENTIVO",
                "TRAMO 1"
            ],

            meta:96

        },

            ],

            meta:60

        },

        {
            nombre:
                "TRAMO 61 AL 90",

            origen:[

            ],

        }

    ];


    let totalCartera = 0;

    let totalRecuperado = 0;

    let totalOperation = 0;

    let totalUnico = 0;

    let totalPromesas = 0;

    let totalMontoPromesas = 0;

            const objetivo =
                m.cartera *
                config.meta /
                100;


            const brecha =
                m.porcentajeRecuperacion -
                config.meta;


            /*
               DIFERENCIA RECUPERO OBJETIVO

               Si recuperado supera objetivo,
               mostramos el excedente.

               Si está por debajo,
               mostramos faltante negativo.
            */

            const diferenciaObjetivo =
                m.recuperado -

            totalCartera +=

                m.recuperado;


            totalOperation +=

            totalUnico +=
                m.qUnico;


            totalPromesas +=
                m.promesas;


            totalMontoPromesas +=
                m.montoPromesas;

/* =========================================================
   CARGA DEL EXCEL
========================================================= */

document
.getElementById(
    "fileInput"
)
.addEventListener(
    "change",
    async function(event){

        const archivo =
            event.target.files[0];


        if(!archivo){

            return;

        }


        document
        .getElementById(
            "fileName"
        )
        .textContent =
            archivo.name;


        const status =
            document.getElementById(
                "status"
            );


        try{

            status.classList.remove(
                "error"
            );


            status.textContent =
                "Procesando archivo...";


            const buffer =
                await archivo.arrayBuffer();


            const workbook =
                XLSX.read(
                    buffer,
                    {

                        type:"array",

                        cellDates:false

                    }
                );


            /*
               BUSCAR MAF EVALUACION
            */

            const hoja =
                workbook
                .SheetNames
                .find(
                    nombre =>
                        normalizar(
                            nombre
                        )
                        ===
                        "MAF_EVALUACION"
                )
                ||
                workbook
                .SheetNames
                .find(
                    nombre =>
                        normalizar(
                            nombre
                        )
                        .includes(
                            "MAF_EVALUACION"
                        )
                );


            if(!hoja){

                throw new Error(
                    "No se encontró la hoja 'MAF Evaluacion'."
                );

            }


            /*
               CONVERTIR A OBJETOS
            */

            DATA =
                XLSX.utils
                .sheet_to_json(
                    workbook.Sheets[
                        hoja
                    ],
                    {

                        defval:"",

                        raw:true,

                        blankrows:false

                    }
                );


            if(
                !DATA.length
            ){

                throw new Error(
                    "La hoja MAF Evaluacion no contiene registros."
                );

            }


            HEADERS =
                Object.keys(
                    DATA[0]
                );


            /*
               MAPEAR
            */

            construirMapa();


            /*
               VALIDAR CAMPOS PRINCIPALES
            */

            const requeridas = [

                [
                    "OPERACION",
                    COL.OP
                ],

                [
                    "CUOTA_DOLARIZADA",
                    COL.CARTERA
                ],

                [
                    "MONTO_PAGO_DOLARIZADO",
                    COL.RECUPERADO
                ],

                [
                    "TRAMO",
                    COL.TRAMO
                ],

                [
                    "TIPO_CUOTA",
                    COL.TIPO
                ],

                [
                    "FLAG_PROMESA",
                    COL.FLAG_PROMESA
                ],

                [
                    "FECHA_PAGO",
                    COL.FECHA_PAGO
                ],

                [
                    "MEJOR_FEC_COMPROMISO",
                    COL.FEC_COMPROMISO

                ]

            ];


            const faltantes =
                requeridas
                .filter(
                    ([nombre,col]) =>
                        !col
                )
                .map(
                    ([nombre]) =>
                        nombre
                );


            if(
                faltantes.length
            ){

                throw new Error(
                    "Faltan columnas requeridas: "
                    +
                    faltantes.join(
                        ", "
                    )
                );

            }


            /*
               CARGAR FILTROS
            */

            cargarFiltros();


            /*
               STATUS
            */

            status.textContent =
                "Archivo cargado correctamente. "
                +
                entero(
                    DATA.length
                )
                +
                " registros.";


            render();

        }
        catch(error){

            console.error(
                error
            );


            status.classList.add(
                "error"
            );


            status.textContent =
                "Error al procesar el archivo: "
                +
                error.message;

        }

    }
);
