<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Command Center MAF / Recupero</title>

<!-- LIBRERÍAS -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>

:root{
    --navy:#0B4168;
    --navy-dark:#083A5D;
    --blue:#168DD0;
    --blue-light:#8FC9ED;

    --green:#12A66A;
    --green-light:#DDF5EA;

    --red:#EF3B50;
    --red-light:#FFE4E8;

    --yellow:#F5A623;
    --purple:#7654D8;

    --bg:#EDF4F8;
    --card:#FFFFFF;
    --line:#D8E2E9;

    --text:#08395F;
    --muted:#647789;

    --shadow:0 3px 12px rgba(8,57,95,.08);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
select,
input{
    font-family:inherit;
}

.app{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:238px;
    background:linear-gradient(
        180deg,
        var(--navy-dark),
        var(--navy)
    );

    color:white;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    padding:28px 10px;
    z-index:100;
}

.logo{
    font-size:31px;
    font-weight:900;
    line-height:.98;
    padding:0 12px 28px;
}

.logo small{
    display:block;
    font-size:15px;
    margin-top:16px;
    font-weight:700;
}

.nav-btn{
    width:100%;
    border:0;
    background:transparent;
    color:white;
    text-align:left;
    padding:15px 16px;
    margin:4px 0;
    border-radius:10px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.nav-btn:hover{
    background:rgba(255,255,255,.10);
}

.nav-btn.active{
    background:#168DD0;
}

/* MAIN */

.main{
    margin-left:238px;
    width:calc(100% - 238px);
    padding:18px;
}

/* HEADER */

.header{
    background:white;
    border-radius:13px;
    padding:20px;
    box-shadow:var(--shadow);
    margin-bottom:14px;
}

.header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.title h1{
    margin:0;
    font-size:25px;
    color:var(--navy-dark);
}

.title p{
    margin:5px 0 0;
    color:var(--muted);
    font-size:12px;
}

.file-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.refresh-btn{
    border:0;
    background:var(--navy);
    color:white;
    border-radius:9px;
    padding:12px 18px;
    font-weight:800;
    cursor:pointer;
}

.refresh-btn:hover{
    background:var(--blue);
}

.file-name{
    font-size:12px;
    color:var(--muted);
}

/* STATUS */

.status{
    background:#E9FFF4;
    border:1px solid #71D8A8;
    color:#087942;
    border-radius:10px;
    padding:12px 15px;
    margin-bottom:14px;
    font-size:13px;
    font-weight:700;
}

.status.error{
    background:#FFF0F2;
    border-color:#F28A99;
    color:#B51E2B;
}

/* FILTERS */

.filters{
    background:white;
    border-radius:13px;
    padding:15px;

    box-shadow:var(--shadow);

    display:grid;
    grid-template-columns:repeat(8,minmax(110px,1fr));

    gap:10px;
    margin-bottom:14px;
}

.filter label{
    display:block;
    font-size:10px;
    font-weight:900;
    color:#587087;
    margin-bottom:5px;
}

.filter select{
    width:100%;
    height:39px;
    border:1px solid #C8D8E5;
    border-radius:7px;
    padding:0 10px;
    background:white;
    color:#173B58;
}

.clear-btn{
    align-self:end;
    height:39px;
    border:0;
    border-radius:8px;
    background:#E8EEF3;
    color:#111;
    font-weight:800;
    cursor:pointer;
}

/* MULTISELECT */

.multi{
    position:relative;
}

.multi-button{
    width:100%;
    height:39px;
    border:1px solid #C8D8E5;
    border-radius:7px;
    background:white;
    text-align:left;
    padding:0 10px;
    cursor:pointer;
    color:#173B58;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.multi-panel{
    display:none;
    position:absolute;
    left:0;
    right:0;
    top:43px;

    background:white;
    border:1px solid #CBD8E2;
    border-radius:8px;

    box-shadow:0 8px 25px rgba(0,0,0,.15);

    z-index:500;

    padding:8px;
    max-height:230px;
    overflow:auto;
}

.multi.open .multi-panel{
    display:block;
}

.multi-option{
    display:flex;
    align-items:center;
    gap:7px;
    padding:6px;
    font-size:12px;
}

.multi-option input{
    width:15px;
    height:15px;
}

/* VIEWS */

.view{
    display:none;
}

.view.active{
    display:block;
}

/* CARDS */

.card{
    background:white;
    border-radius:13px;
    box-shadow:var(--shadow);
    padding:14px;
    margin-bottom:14px;
    overflow:hidden;
}

.card-title{
    margin:0;
    font-size:17px;
    color:var(--navy-dark);
}

.card-sub{
    margin:5px 0 12px;
    font-size:11px;
    color:var(--muted);
}

/* KPIS */

.kpis{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
    margin-bottom:14px;
}

.kpi{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:var(--shadow);
    border-left:5px solid var(--blue);
}

.kpi.green{
    border-left-color:var(--green);
}

.kpi.red{
    border-left-color:var(--red);
}

.kpi.purple{
    border-left-color:var(--purple);
}

.kpi-title{
    font-size:10px;
    font-weight:900;
    color:#60778B;
}

.kpi-value{
    font-size:27px;
    font-weight:900;
    color:var(--navy-dark);
    margin-top:9px;
}

.kpi-desc{
    font-size:9px;
    color:var(--muted);
    margin-top:5px;
}

/* GRIDS */

.grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.grid3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

/* CHART */

.chart-box{
    height:330px;
    position:relative;
}

/* TABLE */

.table-wrap{
    width:100%;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:11px;
    min-width:1050px;
}

thead th{
    background:var(--navy);
    color:white;
    padding:8px;
    text-align:center;
    white-space:nowrap;
    font-size:10px;
}

tbody td{
    padding:8px;
    border-bottom:1px solid #D9E3E9;
    text-align:center;
    white-space:nowrap;
}

tbody tr:nth-child(even){
    background:#F2F6F9;
}

tbody tr:hover{
    background:#E7F1F7;
}

.total-row{
    background:#DCEEF7 !important;
    font-weight:900;
}

.negative{
    color:var(--red);
    font-weight:900;
}

.positive{
    color:#008A57;
    font-weight:900;
}

/* TIPO CUOTA */

.tipo-controls{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:35px;
    margin:10px 0 16px;
}

.tipo-block{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.tipo-title{
    border:2px solid #222;
    padding:7px 22px;
    font-size:11px;
    font-weight:900;
    margin-bottom:9px;
}

.date-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:10px;
    font-weight:900;
}

.date-row input{
    height:35px;
    border:1px solid #CBD9E2;
    border-radius:6px;
    padding:0 8px;
}

.payment-buttons{
    display:flex;
    gap:7px;
}

.payment-buttons button{
    border:1px solid #C6D4DE;
    background:#F7F9FA;
    padding:9px 17px;
    border-radius:7px;
    font-size:10px;
    font-weight:900;
    cursor:pointer;
}

.payment-buttons button.active{
    background:var(--navy);
    color:white;
}

/* RESPONSIVE */

@media(max-width:1300px){

    .filters{
        grid-template-columns:repeat(4,1fr);
    }

    .kpis{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:850px){

    .sidebar{
        width:190px;
    }

    .main{
        margin-left:190px;
        width:calc(100% - 190px);
    }

    .grid2,
    .grid3{
        grid-template-columns:1fr;
    }

    .filters{
        grid-template-columns:repeat(2,1fr);
    }

    .kpis{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    .sidebar{
        display:none;
    }

    .main{
        margin-left:0;
        width:100%;
        padding:8px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .kpis{
        grid-template-columns:1fr;
    }

    .header-row{
        flex-direction:column;
        align-items:flex-start;
    }

    .tipo-controls{
        flex-direction:column;
    }
}

</style>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const ARCHIVO_EXCEL = "maf_2_v5.xlsx";

const APP = {

    data: [],

    headers: [],

    charts: {},

    view: "ejecutivo",

    selectedAsesores: new Set(),

    selectedEstados: new Set(),

    tipoFechaDesde: "",

    tipoFechaHasta: "",

    tipoPagoFiltro: "TODOS",

    iniciado: false

};


/* =========================================================
   COLUMNAS
========================================================= */

const COL = {

    MES:"MES",

    CICLO:"CICLO2",

    TRAMO:"TRAMO_CARTERA",

    ASESOR:"ASESOR_ASIGN",

    SBS:"CALIFICACION_SBS",

    PAGO:"RESPP",

    ESTADO:"ESTADO",

    TIPO:"TIPO_CUOTA",

    OP:"OPERACION",

    SOCIO:"UNICO SOCIO",

    CARTERA:"CUOTA_DOLARIZADA",

    RECUPERADO:"MONTO_PAGO_DOLARIZADO",

    FECHA_PAGO:"FECHA_PAGO",

    FECHA_GESTION:"FECHA_GESTION",

    GEST_CALL:"CANT_GEST_CALL",

    PROMESA_CALL:"CANT_PROMESA_CALL",

    CONTAC_CALL:"CANT_CONTAC_CALL",

    GEST_IVR:"CANT_GEST_IVR",

    GEST_EMAIL:"CANT_GEST_EMAIL",

    GEST_SMS:"CANT_GEST_SMS",

    FLAG_PROMESA:"FLAG_PROMESA",

    FLAG_SEGUIMIENTO:"FLAG_SEGUIMIENTO",

    CONTACTO:"CONTACTO"

};


/* =========================================================
   UTILIDADES
========================================================= */

function texto(v){

    if(v === null || v === undefined)
        return "";

    return String(v).trim();
}


function normalizar(v){

    return texto(v)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/\s+/g," ")
        .trim()
        .toUpperCase();
}


function numero(v){

    if(v === null || v === undefined || v === "")
        return 0;

    if(typeof v === "number")
        return Number.isFinite(v) ? v : 0;

    let s = String(v)
        .replace(/\$/g,"")
        .replace(/,/g,"")
        .trim();

    const n = Number(s);

    return Number.isFinite(n) ? n : 0;
}


function entero(v){

    return Math.round(numero(v))
        .toLocaleString("en-US");
}


function dinero(v){

    return "$" +
        numero(v).toLocaleString(
            "en-US",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );
}


function porcentaje(v){

    return numero(v).toLocaleString(
        "en-US",
        {
            minimumFractionDigits:1,
            maximumFractionDigits:1
        }
    ) + "%";
}


function escapeHTML(v){

    return texto(v)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   RESOLUCIÓN ROBUSTA DE COLUMNAS
========================================================= */

let COLUMN_MAP = {};


function construirMapaColumnas(headers){

    COLUMN_MAP = {};

    headers.forEach(header=>{

        COLUMN_MAP[
            normalizar(header)
        ] = header;

    });

}


function valor(row,col){

    const real = COLUMN_MAP[normalizar(col)];

    if(real !== undefined)
        return row[real];

    return undefined;
}


/* =========================================================
   FECHAS
========================================================= */

function fechaNormalizada(v){

    if(v instanceof Date && !isNaN(v))
        return v;

    if(typeof v === "number"){

        const d = XLSX.SSF.parse_date_code(v);

        if(d){

            return new Date(
                d.y,
                d.m-1,
                d.d
            );

        }

    }

    if(typeof v === "string"){

        const s = v.trim();

        if(!s)
            return null;

        let m = s.match(
            /^(\d{4})-(\d{2})-(\d{2})/
        );

        if(m){

            return new Date(
                Number(m[1]),
                Number(m[2])-1,
                Number(m[3])
            );

        }

        m = s.match(
            /^(\d{2})\/(\d{2})\/(\d{4})/
        );

        if(m){

            return new Date(
                Number(m[3]),
                Number(m[2])-1,
                Number(m[1])
            );

        }

    }

    return null;
}


function fechaISO(v){

    const d = fechaNormalizada(v);

    if(!d)
        return "";

    return [
        d.getFullYear(),
        String(d.getMonth()+1).padStart(2,"0"),
        String(d.getDate()).padStart(2,"0")
    ].join("-");
}


/* =========================================================
   AGRUPACIÓN
========================================================= */

function agrupar(rows,col){

    const map = new Map();

    rows.forEach(row=>{

        const key = texto(
            valor(row,col)
        );

        if(!map.has(key))
            map.set(key,[]);

        map.get(key).push(row);

    });

    return map;
}


/* =========================================================
   Q_OPERATION
   CORRECCIÓN PRINCIPAL
========================================================= */

function contarOperacionesUnicas(rows){

    const operaciones = new Set();

    rows.forEach(row=>{

        const op = texto(
            valor(row,COL.OP)
        );

        if(op !== "")
            operaciones.add(op);

    });

    return operaciones.size;
}


/* =========================================================
   MÉTRICAS
========================================================= */

function calcularMetricas(rows){

    let cartera = 0;

    let recuperado = 0;

    let qConPago = 0;

    let qSinPago = 0;

    let qUnico = 0;

    let seguimientos = 0;

    let promesas = 0;

    let contactosDirectos = 0;

    let montoPromesas = 0;

    let promesasCumplidas = 0;


    /*
       IMPORTANTE:

       Q_OPERATION =
       cantidad de OPERACION únicas.
    */

    const qOperation =
        contarOperacionesUnicas(rows);


    rows.forEach(row=>{

        qUnico += numero(
            valor(row,COL.SOCIO)
        );

        cartera += numero(
            valor(row,COL.CARTERA)
        );


        const pago = numero(
            valor(row,COL.RECUPERADO)
        );

        recuperado += pago;


        if(pago > 0)
            qConPago++;
        else
            qSinPago++;


        seguimientos += numero(
            valor(row,COL.FLAG_SEGUIMIENTO)
        );


        const flagPromesa =
            numero(
                valor(
                    row,
                    COL.FLAG_PROMESA
                )
            );


        promesas += flagPromesa;


        contactosDirectos += numero(
            valor(row,COL.CONTACTO)
        );


        if(flagPromesa > 0){

            montoPromesas += pago;

            if(pago > 0)
                promesasCumplidas++;

        }

    });


    return {

        cartera,

        recuperado,

        saldo:cartera-recuperado,

        qOperation,

        qUnico,

        qConPago,

        qSinPago,

        seguimientos,

        promesas,

        contactosDirectos,

        montoPromesas,

        promesasCumplidas,

        porcentajeRecuperacion:
            cartera > 0
            ? recuperado/cartera*100
            : 0,

        porcentajeContactoDirecto:
            qOperation > 0
            ? contactosDirectos/qOperation*100
            : 0,

        efectPDP:
            promesas > 0
            ? promesasCumplidas/promesas*100
            : 0

    };

}


/* =========================================================
   PRODUCTIVIDAD / INTENSIDAD
========================================================= */

function calcularProductividad(rows){

    let cobertura = 0;

    let promesa = 0;

    let contacto = 0;

    let ivr = 0;

    let email = 0;

    let sms = 0;


    rows.forEach(row=>{

        cobertura += numero(
            valor(row,COL.GEST_CALL)
        );

        promesa += numero(
            valor(row,COL.PROMESA_CALL)
        );

        contacto += numero(
            valor(row,COL.CONTAC_CALL)
        );

        ivr += numero(
            valor(row,COL.GEST_IVR)
        );

        email += numero(
            valor(row,COL.GEST_EMAIL)
        );

        sms += numero(
            valor(row,COL.GEST_SMS)
        );

    });


    /*
       Q_OPERATION CORREGIDO

       NO usamos rows.length

       NO contamos registros repetidos.

       Usamos operaciones únicas.
    */

    const operaciones =
        contarOperacionesUnicas(rows);


    /*
       INTENSIDAD MARCADOR

       SUM(CANT_GEST_CALL)
       /
       Q_OPERATION
    */

    const intensidadMarcador =
        operaciones > 0
        ? cobertura / operaciones
        : 0;


    /*
       INTENSIDAD MARCADOR VARIOS

       (
          CANT_PROMESA_CALL
          +
          CANT_CONTAC_CALL
          +
          CANT_GEST_IVR
          +
          CANT_GEST_EMAIL
          +
          CANT_GEST_SMS
       )
       /
       Q_OPERATION
    */

    const varios =
        promesa +
        contacto +
        ivr +
        email +
        sms;


    const intensidadVarios =
        operaciones > 0
        ? varios / operaciones
        : 0;


    /*
       INTENSIDAD GENERAL

       (
          CANT_GEST_CALL
          +
          CANT_PROMESA_CALL
          +
          CANT_CONTAC_CALL
          +
          CANT_GEST_IVR
          +
          CANT_GEST_EMAIL
          +
          CANT_GEST_SMS
       )
       /
       Q_OPERATION
    */

    const intensidadGeneral =
        operaciones > 0
        ? (cobertura + varios) / operaciones
        : 0;


    return {

        cobertura,

        intensidadGeneral,

        intensidadMarcador,

        intensidadVarios,

        operaciones

    };

}

        if(
            pago !== "__ALL__" &&

function cargarSelect(id,col){

            APP.data
            .map(row =>

            .filter(Boolean)

        .sort(

        '<option value="__ALL__">Todos</option>';

            document.createElement("option");

        option.value = v;

        option.textContent = v;

        select.appendChild(option);

    });

/* =========================================================
   MULTI SELECT
========================================================= */

function construirMultiSelect(
    containerId,
    panelId,
    col,
    selectedSet
){

    const container =
        document.getElementById(containerId);

    const panel =
        document.getElementById(panelId);

    if(!container || !panel)
        return;


    const button =
        container.querySelector(
            ".multi-button"
        );


    const valores =
        [...new Set(

            APP.data
            .map(row =>
                texto(valor(row,col))
            )
            .filter(Boolean)

        )]
        .sort(
            (a,b)=>
                a.localeCompare(b,"es")
        );


    panel.innerHTML = "";


    valores.forEach(v=>{

        const label =
            document.createElement("label");

        label.className =
            "multi-option";


        const input =
            document.createElement("input");

        input.type = "checkbox";

        input.value = v;

        input.checked =
            selectedSet.has(v);


        input.addEventListener(
            "change",
            ()=>{

                if(input.checked)
                    selectedSet.add(v);
                else
                    selectedSet.delete(v);


                actualizarMultiButton(
                    button,
                    selectedSet
                );

                render();

            }
        );


        label.appendChild(input);


        const span =
            document.createElement("span");

        span.textContent = v;

        label.appendChild(span);

        panel.appendChild(label);

    });


    button.onclick = e=>{

        e.stopPropagation();

        container.classList.toggle("open");

    };


    panel.onclick = e=>{
        e.stopPropagation();
    };


    actualizarMultiButton(
        button,
        selectedSet
    );

}


function actualizarMultiButton(
    button,
    set
){

    if(!set.size){

        button.textContent = "Todos";

        return;

    }


    if(set.size === 1){

        button.textContent =
            [...set][0];

        return;

    }


    button.textContent =
        `${set.size} seleccionados`;

}

function destruirChart(id){

    if(APP.charts[id]){

        APP.charts[id].destroy();

        delete APP.charts[id];

    }

}


function crearGraficoBarras(
    id,
    labels,
    datasets,
    formato
){

    destruirChart(id);


    const canvas =
        document.getElementById(id);

    if(!canvas)
        return;


    APP.charts[id] =
        new Chart(
            canvas,
            {

                type:"bar",

                data:{
                    labels,
                    datasets
                },

                plugins:[
                    ChartDataLabels
                ],

                options:{

                    responsive:true,

                    maintainAspectRatio:false,

                    plugins:{

                        legend:{
                            position:"top"
                        },

                        datalabels:{

                            anchor:"end",

                            align:"top",

                            font:{
                                size:9,
                                weight:"bold"
                            },

                            formatter:value=>{

                                if(formato === "money")
                                    return dinero(value);

                                if(formato === "pct")
                                    return porcentaje(value);

                                return entero(value);

                            }

                        }

                    },

                    scales:{

                        y:{
                            beginAtZero:true
                        }

                    }

                }

            }
        );

}

function calcularTramo(rows,origen){

    const data =
        rows.filter(
            row =>
                origen.includes(
                    normalizar(
                        valor(
                            row,
                            COL.TRAMO
                        )
                    )
                )
        );


    return calcularMetricas(data);

}

        .forEach(
            view =>

        );

        );


    if(actual)
        actual.classList.add("active");


    switch(APP.view){

        case "ejecutivo":
            renderEjecutivo(rows);
            break;

        case "recupero":
            renderRecupero(rows);
            break;

        case "gestion":
            renderGestion(rows);
            break;

        case "cartera":
            renderCartera(rows);
            break;

        case "asesores":
            renderAsesores(rows);
            break;

        case "tramos":
            renderTramos(rows);
            break;

    }

}

function validarColumnas(){

    const obligatorias = [

        COL.OP,
        COL.CARTERA,
        COL.RECUPERADO,
        COL.TIPO,
        COL.GEST_CALL,
        COL.PROMESA_CALL,
        COL.CONTAC_CALL,
        COL.GEST_IVR,
        COL.GEST_EMAIL,
        COL.GEST_SMS,
        COL.ESTADO

    ];


    const faltantes =
        obligatorias.filter(
            col =>
                COLUMN_MAP[
                    normalizar(col)
                ] === undefined
        );


    return faltantes;

}


/* =========================================================
   CARGA EXCEL
========================================================= */

async function cargarExcelAutomaticamente(){

    const status =
        document.getElementById("status");


    status.classList.remove("error");


    status.textContent =
        `Cargando ${ARCHIVO_EXCEL}...`;


    try{

        const url =
            `./${ARCHIVO_EXCEL}?v=${Date.now()}`;


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                `No se pudo cargar ${ARCHIVO_EXCEL}. ` +
                `Código HTTP: ${response.status}`
            );

        }


        const buffer =
            await response.arrayBuffer();


        const workbook =
            XLSX.read(
                buffer,
                {
                    type:"array",
                    cellDates:true,
                    cellNF:false,
                    cellText:false
                }
            );


        /*
           BUSCAR HOJA MAF EVALUACION
        */

        const hoja =
            workbook.SheetNames.find(
                nombre =>
                    normalizar(nombre) ===
                    "MAF EVALUACION"
            )
            ||
            workbook.SheetNames.find(
                nombre =>
                    normalizar(nombre)
                    .includes("MAF EVALUACION")
            );


        if(!hoja){

            throw new Error(
                "No se encontró la hoja " +
                "'MAF Evaluacion'. " +
                "Hojas disponibles: " +
                workbook.SheetNames.join(", ")
            );

        }


        APP.data =
            XLSX.utils.sheet_to_json(
                workbook.Sheets[hoja],
                {
                    defval:"",
                    raw:true,
                    blankrows:false
                }
            );


        if(!APP.data.length){

            throw new Error(
                `La hoja "${hoja}" no contiene registros.`
            );

        }


        APP.headers =
            Object.keys(
                APP.data[0]
            );


        /*
           CONSTRUIR MAPA DE COLUMNAS
        */

        construirMapaColumnas(
            APP.headers
        );


        /*
           VALIDAR
        */

        const faltantes =
            validarColumnas();


        if(faltantes.length){

            throw new Error(
                "Faltan columnas requeridas: " +
                faltantes.join(", ")
            );

        }


        /*
           FILTROS
        */

        cargarFiltros();


        /*
           ESTADO
        */

        status.classList.remove("error");


        status.innerHTML =
            "Archivo cargado correctamente. " +
            `<b>${entero(APP.data.length)}</b> registros. ` +
            `Hoja: <b>${escapeHTML(hoja)}</b>. ` +
            `Fuente: ${ARCHIVO_EXCEL}`;


        /*
           RENDER
        */

        render();


        APP.iniciado = true;

    }
    catch(error){

        console.error(error);


        APP.data = [];


        status.classList.add("error");


        status.innerHTML =
            "<b>Error:</b> " +
            escapeHTML(
                error.message
            );


        document.getElementById(
            "ejecutivo"
        ).innerHTML = `

            <div class="card">

                <h2 class="card-title">
                    No se pudo cargar el dashboard
                </h2>

                <p class="card-sub">

                    Verifica que en GitHub estén
                    exactamente estos archivos:

                </p>

                <pre>
index.html
maf_2_v5.xlsx
                </pre>

                <p class="card-sub">

                    Además verifica que el nombre del
                    archivo Excel coincida exactamente,
                    incluyendo mayúsculas/minúsculas.

                </p>

            </div>

        `;

    }

}

document
