<style>

body{

/* =========================================================
SIDEBAR
========================================================= */

.logo{

/* =========================================================
MAIN
========================================================= */

.main{

HEADER
========================================================= */

.title h1{

.title p{

}

.file-area{

.refresh-btn:hover{

}

.file-name{

    color:var(--muted);

/* =========================================================
STATUS
========================================================= */

.status{

}

.status.error{

}

/* =========================================================
FILTERS
========================================================= */

.filters{

    display:grid;

.filter label{

.filter select{

}

/* =========================================================
MULTI SELECT
========================================================= */

.multi{

.multi-button{

VIEWS

CARDS

/* =========================================================

/* =========================================================

<script>

/* =========================================================
ESTADO DE LA APLICACIÓN
========================================================= */

const APP = {

    data:[],

    headers:[],

    charts:{},

    view:"ejecutivo",

    selectedAsesores:new Set(),

    selectedEstados:new Set(),

    tipoFechaDesde:"",

    tipoFechaHasta:"",

    tipoPagoFiltro:"TODOS"

};


/* =========================================================
COLUMNAS REALES
========================================================= */

const COL = {

    MES:
        "MES",

    CICLO:
        "CICLO2",

    TRAMO:
        "TRAMO_CARTERA",

    ASESOR:
        "ASESOR_ASIGN",

    SBS:
        "CALIFICACION_SBS",

    PAGO:
        "RESPP",

    ESTADO:
        "ESTADO",

    TIPO:
        "TIPO_CUOTA",

    OP:
        "OPERACION",

    SOCIO:
        "UNICO SOCIO",

    CARTERA:
        "CUOTA_DOLARIZADA",

    RECUPERADO:
        "MONTO_PAGO_DOLARIZADO",

    FECHA_PAGO:
        "FECHA_PAGO",

    FECHA_GESTION:
        "FECHA_GESTION",

    GEST_CALL:
        "CANT_GEST_CALL",

    PROMESA_CALL:
        "CANT_PROMESA_CALL",

    CONTAC_CALL:
        "CANT_CONTAC_CALL",

    GEST_IVR:
        "CANT_GEST_IVR",

    GEST_EMAIL:
        "CANT_GEST_EMAIL",

    GEST_SMS:
        "CANT_GEST_SMS",

    FLAG_PROMESA:
        "FLAG_PROMESA",

    FLAG_SEGUIMIENTO:
        "FLAG_SEGUIMIENTO",

    CONTACTO:
        "CONTACTO",

    SIN_PAGO:
        "SIN PAGO",

    CON_PAGO:
        "CON PAGO"

};


/* =========================================================
UTILIDADES
========================================================= */

function texto(v){

    if(v === null || v === undefined)
        return "";

    return String(v)
        .trim();

}


function normalizar(v){

    return texto(v)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/\s+/g," ")
        .trim()
        .toUpperCase();

}


function numero(v){

    if(v === null || v === undefined || v === "")
        return 0;

    if(typeof v === "number")
        return Number.isFinite(v) ? v : 0;

    let s = String(v)
        .replace(/\$/g,"")
        .replace(/,/g,"")
        .trim();

    const n = Number(s);

    return Number.isFinite(n) ? n : 0;

}


function entero(v){

    return Math.round(numero(v))
        .toLocaleString("en-US");

}


function dinero(v){

    return "$" +
        numero(v).toLocaleString(
            "en-US",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


function porcentaje(v){

    return numero(v).toLocaleString(
        "en-US",
        {
            minimumFractionDigits:1,
            maximumFractionDigits:1
        }
    ) + "%";

}


function escapeHTML(v){

    return texto(v)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function valor(row,col){

    return row[col];

}


function fechaNormalizada(v){

    if(v instanceof Date &&
       !isNaN(v))
        return v;

    if(typeof v === "number"){

        const d =
            XLSX.SSF.parse_date_code(v);

        if(d){

            return new Date(
                d.y,
                d.m-1,
                d.d
            );

        }

    }

    if(typeof v === "string"){

        const s=v.trim();

        if(!s)
            return null;

        const iso =
            s.match(
                /^(\d{4})-(\d{2})-(\d{2})/
            );

        if(iso){

            return new Date(
                Number(iso[1]),
                Number(iso[2])-1,
                Number(iso[3])
            );

        }

        const lat =
            s.match(
                /^(\d{2})\/(\d{2})\/(\d{4})/
            );

        if(lat){

            return new Date(
                Number(lat[3]),
                Number(lat[2])-1,
                Number(lat[1])
            );

        }

    }

    return null;

}


function fechaISO(v){

    const d=fechaNormalizada(v);

    if(!d)
        return "";

    const y=d.getFullYear();

    const m=
        String(
            d.getMonth()+1
        ).padStart(2,"0");

    const day=
        String(
            d.getDate()
        ).padStart(2,"0");

    return `${y}-${m}-${day}`;

}


/* =========================================================
AGRUPACIÓN
========================================================= */

function agrupar(rows,col){

    const map=new Map();

    rows.forEach(row=>{

        const key=
            texto(
                valor(row,col)
            );

        if(!map.has(key))
            map.set(key,[]);

        map.get(key).push(row);

    });

    return map;

}


/* =========================================================
MÉTRICAS GENERALES
========================================================= */

function calcularMetricas(rows){

    let cartera=0;

    let recuperado=0;

    let qOperation=0;

    let qUnico=0;

    let qConPago=0;

    let qSinPago=0;

    let seguimientos=0;

    let promesas=0;

    let contactosDirectos=0;

    let montoPromesas=0;

    let promesasCumplidas=0;


    rows.forEach(row=>{

        if(
            texto(
                valor(row,COL.OP)
            ) !== ""
        )
            qOperation++;


        qUnico +=
            numero(
                valor(row,COL.SOCIO)
            );


        cartera +=
            numero(
                valor(row,COL.CARTERA)
            );


        const pago=
            numero(
                valor(row,COL.RECUPERADO)
            );


        recuperado += pago;


        if(pago > 0)
            qConPago++;

        else
            qSinPago++;


        seguimientos +=
            numero(
                valor(
                    row,
                    COL.FLAG_SEGUIMIENTO
                )
            );


        const flagPromesa=
            numero(
                valor(
                    row,
                    COL.FLAG_PROMESA
                )
            );


        promesas +=
            flagPromesa;


        contactosDirectos +=
            numero(
                valor(
                    row,
                    COL.CONTACTO
                )
            );


        /*
        Monto Promesas:

        MONTO_PAGO_DOLARIZADO
        solamente cuando
        FLAG_PROMESA = 1
        */

        if(flagPromesa > 0){

            montoPromesas += pago;

            if(pago > 0)
                promesasCumplidas++;

        }

    });


    return {

        cartera,

        recuperado,

        saldo:
            cartera-recuperado,

        qOperation,

        qUnico,

        qConPago,

        qSinPago,

        seguimientos,

        promesas,

        contactosDirectos,

        montoPromesas,

        promesasCumplidas,

        porcentajeRecuperacion:
            cartera > 0
                ? recuperado/cartera*100
                : 0,

        porcentajeContactoDirecto:
            qOperation > 0
                ? contactosDirectos/
                  qOperation*100
                : 0,

        efectPDP:
            promesas > 0
                ? promesasCumplidas/
                  promesas*100
                : 0

    };

}


/* =========================================================
PRODUCTIVIDAD / INTENSIDAD
========================================================= */

function calcularProductividad(rows){

    let cobertura=0;

    let promesa=0;

    let contacto=0;

    let ivr=0;

    let email=0;

    let sms=0;

    let operaciones=0;


    rows.forEach(row=>{

        if(
            texto(
                valor(row,COL.OP)
            ) !== ""
        )
            operaciones++;


        cobertura +=
            numero(
                valor(
                    row,
                    COL.GEST_CALL
                )
            );


        promesa +=
            numero(
                valor(
                    row,
                    COL.PROMESA_CALL
                )
            );


        contacto +=
            numero(
                valor(
                    row,
                    COL.CONTAC_CALL
                )
            );


        ivr +=
            numero(
                valor(
                    row,
                    COL.GEST_IVR
                )
            );


        email +=
            numero(
                valor(
                    row,
                    COL.GEST_EMAIL
                )
            );


        sms +=
            numero(
                valor(
                    row,
                    COL.GEST_SMS
                )
            );

    });


    const varios=
        promesa+
        contacto+
        ivr+
        email+
        sms;


    /*
    INTENSIDAD MARCADOR

    CANT_GEST_CALL /
    Q_OPERATION
    */

    const intensidadMarcador=
        operaciones > 0
            ? cobertura/
              operaciones
            : 0;


    /*
    INTENSIDAD MARCADOR VARIOS

    (
      CANT_PROMESA_CALL
      +
      CANT_CONTAC_CALL
      +
      CANT_GEST_IVR
      +
      CANT_GEST_EMAIL
      +
      CANT_GEST_SMS
    )
    /
    Q_OPERATION
    */

    const intensidadVarios=
        operaciones > 0
            ? varios/
              operaciones
            : 0;


    /*
    INTENSIDAD GENERAL

    CANT_GEST_CALL
    +
    VARIOS

    /
    Q_OPERATION
    */

    const intensidadGeneral=
        operaciones > 0
            ?
            (
                cobertura+
                varios
            )/
            operaciones
            :
            0;


    return {

        cobertura,

        intensidadGeneral,

        intensidadMarcador,

        intensidadVarios,

        operaciones

    };

}

        if(

                )
            ) !== ciclo
        )
            return false;


        if(
            tramo!=="__ALL__" &&

                valor(
                    row,
                    COL.TRAMO
                )
            ) !== tramo
        )
            return false;


        if(
            sbs!=="__ALL__" &&
            texto(
                valor(
                    row,
                    COL.SBS
                )
            ) !== sbs
        )
            return false;


        if(
            pago!=="__ALL__" &&
            texto(
                valor(
                    row,
                    COL.PAGO
                )
            ) !== pago
        )
            return false;


        if(
            tipo!=="__ALL__" &&
            texto(
                valor(
                    row,
                    COL.TIPO
                )
            ) !== tipo
        )
            return false;


        if(

/* =========================================================
CARGAR SELECT
========================================================= */

function cargarSelect(id,col){

    const select=
        document.getElementById(id);

    if(!select)
        return;


    const valores=
        [
            ...new Set(
                APP.data
                .map(
                    row =>
                        texto(
                            valor(row,col)
                        )
                )
                .filter(Boolean)
            )
        ]
        .sort(
            (a,b)=>
                a.localeCompare(
                    b,
                    "es",
                    {
                        numeric:true
                    }
                )
        );


    select.innerHTML=
        `<option value="__ALL__">
            Todos
        </option>`;


    valores.forEach(v=>{

        const option=
            document.createElement(
                "option"
            );

        option.value=v;

        option.textContent=v;

        select.appendChild(
            option
        );

    });

}


/* =========================================================
MULTI SELECT
========================================================= */

function construirMultiSelect(
    containerId,
    panelId,
    col,
    selectedSet
){

    const container=
        document.getElementById(
            containerId
        );

    const panel=
        document.getElementById(
            panelId
        );


    if(!container || !panel)
        return;


    const button=
        container.querySelector(
            ".multi-button"
        );


    const valores=
        [
            ...new Set(
                APP.data
                .map(
                    row =>
                        texto(
                            valor(
                                row,
                                col
                            )
                        )
                )
                .filter(Boolean)
            )
        ]
        .sort(
            (a,b)=>
                a.localeCompare(
                    b,
                    "es"
                )
        );


    panel.innerHTML="";


    valores.forEach(v=>{

        const label=
            document.createElement(
                "label"
            );

        label.className=
            "multi-option";


        const input=
            document.createElement(
                "input"
            );

        input.type="checkbox";

        input.value=v;

        input.checked=
            selectedSet.has(v);


        input.addEventListener(
            "change",
            ()=>{

                if(input.checked)
                    selectedSet.add(v);

                else
                    selectedSet.delete(v);


                actualizarMultiButton(
                    button,
                    selectedSet
                );


                render();

            }
        );


        label.appendChild(input);


        const span=
            document.createElement(
                "span"
            );

        span.textContent=v;


        label.appendChild(span);


        panel.appendChild(label);

    });


    button.onclick=
        e=>{

            e.stopPropagation();

            container.classList.toggle(
                "open"
            );

        };


    panel.onclick=
        e=>{
            e.stopPropagation();
        };


    actualizarMultiButton(
        button,
        selectedSet
    );

}


function actualizarMultiButton(
    button,
    set
){

    if(!set.size){

        button.textContent=
            "Todos";

        return;

    }


    if(set.size===1){

        button.textContent=
            [...set][0];

        return;

    }


    button.textContent=
        `${set.size} seleccionados`;

}

function destruirChart(id){

function crearGraficoBarras(
    id,
    labels,
    datasets,
    formato
){

    destruirChart(id);


    const canvas=
        document.getElementById(id);


    if(!canvas)

    APP.charts[id]=
        new Chart(
            canvas,
            {

                type:"bar",

                data:{
                    labels,
                    datasets
                },

                plugins:[
                    ChartDataLabels
                ],

                options:{

                    responsive:true,

                    maintainAspectRatio:false,

                    plugins:{

                        legend:{

                        },

                            anchor:"end",

                                        ===

                                    )

/* =========================================================
TIPO CUOTA - FILTRO LOCAL
========================================================= */

function obtenerFiltradosTipoCuota(rows){

    return rows.filter(row=>{

        const pago=
            numero(
                valor(
                    row,
                    COL.RECUPERADO
                )
            );


        if(
            APP.tipoPagoFiltro ===
            "CON PAGO"
            &&
            pago <= 0
        )
            return false;


        if(
            APP.tipoPagoFiltro ===
            "SIN PAGO"
            &&
            pago > 0
        )
            return false;


        if(APP.tipoFechaDesde){

            const f=
                fechaISO(
                    valor(
                        row,
                        COL.FECHA_PAGO
                    )
                );


            if(
                !f ||
                f <
                APP.tipoFechaDesde
            )
                return false;

        }


        if(APP.tipoFechaHasta){

            const f=
                fechaISO(
                    valor(
                        row,
                        COL.FECHA_PAGO
                    )
                );


            if(
                !f ||
                f >
                APP.tipoFechaHasta
            )
                return false;

        }

/* =========================================================
TABLA TIPO CUOTA
========================================================= */

function tablaTipoCuota(rows){

    const grupos=
        agrupar(
            rows,
            COL.TIPO
        );


    const tipos=
        [...grupos.keys()]
        .filter(Boolean)
        .sort(
            (a,b)=>{

                const orden=[
                    "NORMAL",
                    "TAXI",
                    "BIGTICKET",
                    "BALON",
                    "1RA4TA5TA",
                    "TOP"
                ];

                const ia=
                    orden.indexOf(
                        normalizar(a)
                    );

                const ib=
                    orden.indexOf(
                        normalizar(b)
                    );


                if(ia>=0 && ib>=0)
                    return ia-ib;

                if(ia>=0)
                    return -1;

                if(ib>=0)
                    return 1;

                return a.localeCompare(
                    b,
                    "es"
                );

            }
        );


    let html=`

    <div class="table-wrap">

    <table>

    <thead>

    <tr>

        <th>TIPO_CUOTA</th>

        <th>Cartera</th>

        <th>Recuperado</th>

        <th>% Rec.</th>

        <th>Saldo</th>

        <th>Q_OPERATION</th>

        <th>Q_UNICO</th>

        <th>Con pago</th>

        <th>Sin pago</th>

        <th>Cobertura cartera</th>

        <th>Intensidad General</th>

        <th>Intensidad Marcador</th>

        <th>Intensidad Marcador varios</th>

    </tr>

    </thead>

    <tbody>

    `;


    tipos.forEach(tipo=>{

        const grupo=
            grupos.get(tipo);


        const m=
            calcularMetricas(
                grupo
            );


        const p=
            calcularProductividad(
                grupo
            );


        html+=`

        <tr>

            <td>
                <b>
                    ${escapeHTML(tipo)}
                </b>
            </td>

            <td>
                ${dinero(m.cartera)}
            </td>

            <td>
                ${dinero(m.recuperado)}
            </td>

            <td>
                ${porcentaje(
                    m.porcentajeRecuperacion
                )}
            </td>

            <td>
                ${dinero(m.saldo)}
            </td>

            <td>
                ${entero(m.qOperation)}
            </td>

            <td>
                ${entero(m.qUnico)}
            </td>

            <td>
                ${entero(m.qConPago)}
            </td>

            <td>
                ${entero(m.qSinPago)}
            </td>

            <td>
                ${entero(p.cobertura)}
            </td>

            <td>
                ${p.intensidadGeneral.toFixed(2)}
            </td>

            <td>
                ${p.intensidadMarcador.toFixed(2)}
            </td>

            <td>
                ${p.intensidadVarios.toFixed(2)}
            </td>

        </tr>

        `;

    });


    if(!tipos.length){

        html+=`

        <tr>

            <td
                colspan="13">

                No existen registros para
                los filtros seleccionados.

            </td>

        </tr>

        `;

    }


    html+=`

    </tbody>

    </table>

    </div>

    `;


    return html;

}

/* =========================================================
CARGA AUTOMÁTICA DEL EXCEL
========================================================= */

async function cargarExcelAutomaticamente(){

    const status=
        document.getElementById(
            "status"
        );


    status.classList.remove(
        "error"
    );


    status.textContent=
        "Cargando automáticamente maf_2_v5.xlsx...";


    try{

        /*
        IMPORTANTE:

        El Excel está en el mismo
        directorio que index.html.

        ./maf_2_v5.xlsx
        */


        const url=
            "./maf_2_v5.xlsx?v="+
            Date.now();


        const response=
            await fetch(
                url,
                {
                    method:"GET",

                    cache:"no-store",

                    headers:{
                        "Cache-Control":
                            "no-cache"
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                "No se pudo cargar maf_2_v5.xlsx. " +
                "Código HTTP: "+
                response.status
            );

        }


        const buffer=
            await response.arrayBuffer();


        const workbook=
            XLSX.read(
                buffer,
                {
                    type:"array",

                    cellDates:true,

                    cellNF:false,

                    cellText:false
                }
            );


        /*
        BUSCAR HOJA
        */


        const hoja=
            workbook.SheetNames.find(
                nombre =>
                    normalizar(
                        nombre
                    )
                    ===
                    "MAF EVALUACION"
            )
            ||
            workbook.SheetNames.find(
                nombre =>
                    normalizar(
                        nombre
                    )
                    .includes(
                        "MAF EVALUACION"
                    )
            );


        if(!hoja){

            throw new Error(
                "No se encontró la hoja " +
                "'MAF Evaluacion'. " +
                "Hojas disponibles: "+
                workbook.SheetNames.join(
                    ", "
                )
            );

        }


        /*
        LEER HOJA
        */


        APP.data=
            XLSX.utils.sheet_to_json(
                workbook.Sheets[hoja],
                {
                    defval:"",
                    raw:true,
                    blankrows:false
                }
            );


        if(
            APP.data.length===0
        ){

            throw new Error(
                "La hoja MAF Evaluacion " +
                "no contiene registros."
            );

        }


        APP.headers=
            Object.keys(
                APP.data[0]
            );


        /*
        VALIDAR COLUMNAS
        */


        const obligatorias=[

            COL.OP,

            COL.CARTERA,

            COL.RECUPERADO,

            COL.TIPO,

            COL.GEST_CALL,

            COL.PROMESA_CALL,

            COL.CONTAC_CALL,

            COL.GEST_IVR,

            COL.GEST_EMAIL,

            COL.GEST_SMS,

            COL.FLAG_PROMESA,

            COL.FLAG_SEGUIMIENTO,

            COL.ESTADO

        ];


        const faltantes=
            obligatorias.filter(
                col =>
                    !APP.headers.includes(
                        col
                    )
            );


        if(
            faltantes.length
        ){

            throw new Error(
                "Faltan columnas requeridas: "+
                faltantes.join(", ")
            );

        }


        /*
        CARGAR FILTROS
        */


        cargarFiltros();


        /*
        ESTADO
        */


        status.classList.remove(
            "error"
        );


        status.innerHTML=
            "Archivo cargado correctamente. "+
            `<b>${entero(
                APP.data.length
            )}</b> registros. `+
            "Fuente: maf_2_v5.xlsx";


        /*
        RENDER
        */


        render();


    }
    catch(error){

        console.error(error);


        APP.data=[];


        status.classList.add(
            "error"
        );


        status.innerHTML=
            "<b>Error:</b> "+
            escapeHTML(
                error.message
            );


        document.getElementById(
            "ejecutivo"
        ).innerHTML=

            `

            <div class="card">

                <h2 class="card-title">
                    No se pudo cargar el dashboard
                </h2>

                <p class="card-sub">

                    Verifica que estos dos archivos
                    estén en la misma carpeta:

                </p>

                <pre>
index.html
maf_2_v5.xlsx
                </pre>

                <p class="card-sub">

                    Si estás utilizando GitHub Pages,
                    realiza un nuevo commit/push del Excel
                    y luego utiliza "Actualizar datos".

                </p>

            </div>

            `;

    }

}

/*
IMPORTANTE:

DOMContentLoaded puede haberse
disparado antes de este script.

Por eso hacemos también
la carga inmediata.
*/

if(
    document.readyState ===
    "loading"
){

    // DOMContentLoaded se encargará

}
else{

    cargarExcelAutomaticamente();

}

</script>
