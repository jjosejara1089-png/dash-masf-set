<style>
:root{
 --navy:#07395f;
 --blue:#168bd0;
 --blue2:#0f4c81;
 --green:#12a66a;
 --red:#ef4056;
 --purple:#7650e6;
 --bg:#edf5fa;
 --panel:#fff;
 --text:#17344e;
 --muted:#687783;

 --soft:#f4f7f9;
}

*{
 box-sizing:border-box
}

html,body{
 margin:0;
 padding:0;
 min-height:100%;
 font-family:Arial,Helvetica,sans-serif
}

body{
 background:var(--bg);
 color:var(--text)
}

.app{

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
 position:fixed;
 top:0;
 left:0;
 bottom:0;
 width:245px;
 background:var(--navy);
 color:#fff;
 padding:24px 10px;
 overflow-y:auto;
 z-index:1000
}

.logo{
 padding:5px 14px 22px;
 font-size:31px;
 font-weight:900;
 line-height:1.2
}

.logo small{
 display:block;
 margin-top:10px;
 font-size:15px;
 color:#d7e7f2
}

.nav-btn{
 width:100%;
 border:none;
 background:transparent;
 color:#fff;
 padding:15px 14px;
 margin:4px 0;
 border-radius:10px;
 text-align:left;
 cursor:pointer;
 font-size:15px;
 font-weight:800
}

.nav-btn:hover,
.nav-btn.active{
 background:var(--blue)
}

/* =========================================================
   MAIN
========================================================= */

.main{
 margin-left:245px;
 width:calc(100% - 245px);
 padding:18px
}

.header{
 min-height:72px;
 padding:15px 18px;
 border-radius:11px;
 background:#07395f;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px
}

.header h1{
 margin:0;
 font-size:24px
}

.header small{
 display:block;
 margin-top:5px;
 color:#d7e7f2
}

.file-area{
 display:flex;
 align-items:center;
 gap:10px
}

.file-button{
 display:inline-block;
 background:#168bd0;
 color:#fff;
 padding:12px 18px;
 border-radius:8px;
 border:1px solid #70c4ee;
 cursor:pointer;
 font-weight:800
}

#fileInput{
 display:none
}

#fileName{
 max-width:180px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 font-size:12px
}

.status{
 margin:12px 0;
 padding:12px 15px;
 border-radius:9px;
 background:#ecfff5;
 border:1px solid #8bdfba;
 color:#08784e;
 font-size:14px;
 font-weight:700
}

.status.error{
 background:#fff0f0;
 border-color:#e0a4a4;
 color:#b3261e
}

.status.loading{
 background:#eef7ff;
 border-color:#9bc8eb;
 color:#07558b
}

/* =========================================================
   FILTROS GENERALES
========================================================= */

.filters{
 background:#fff;
 border:1px solid var(--border);
 border-radius:11px;
 padding:12px;
 margin-bottom:12px;
 display:grid;
 grid-template-columns:repeat(8,minmax(105px,1fr)) auto;
 gap:9px;
 box-shadow:0 3px 12px rgba(0,0,0,.05)
}

.filter label{
 display:block;
 color:var(--muted);
 font-size:10px;
 font-weight:900;
 margin-bottom:5px;
 text-transform:uppercase
}

.filter select,
.multi-button{
 width:100%;
 height:38px;
 border:1px solid #ccd6de;
 border-radius:7px;
 background:#fff;
 padding:0 9px;
 font-size:12px
}

.clear{
 height:38px;
 align-self:end;
 border:0;
 border-radius:7px;
 background:#e7eef3;
 padding:0 17px;
 cursor:pointer;
 font-weight:800
}

.clear:hover{
 background:#d9e3e9
}

/* =========================================================
   MULTISELECCION
========================================================= */

.multi-select{
 position:relative
}

.multi-button{
 text-align:left;
 cursor:pointer;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis
}

.multi-dropdown{
 display:none;
 position:absolute;
 top:43px;
 left:0;
 width:350px;
 background:#fff;
 border:1px solid #ccd6de;
 border-radius:9px;
 box-shadow:0 10px 25px rgba(0,0,0,.22);

 padding:10px
}

.multi-dropdown.open{
 display:block
}

.multi-search{

 height:35px;

 border-radius:7px;
 padding:0 10px;
 margin-bottom:8px
}

.multi-actions{
 display:flex;
 gap:7px;
 margin-bottom:8px
}

.multi-actions button,

 border:0;
 border-radius:6px;
 padding:7px 10px;
 cursor:pointer;
 font-size:11px;
 font-weight:800

.multi-actions button{

}

.multi-apply{

.multi-list{
 max-height:300px;

 border-top:1px solid var(--border);
 border-bottom:1px solid var(--border)
}

.multi-item{
 display:flex;
 gap:8px;
 align-items:center;
 padding:7px 4px;
 font-size:11px;
 font-weight:700
}

.multi-footer{
 padding-top:8px;
 display:flex;
 justify-content:flex-end
}

.multi-select.estado-select .multi-dropdown{
 width:240px
}

.multi-select.estado-select .multi-list{
 max-height:220px
}

.multi-select.estado-select .multi-item{
 padding:8px 5px
}

/* =========================================================
   VISTAS
========================================================= */

.view{
 display:none
}

.view.active{
 display:block
}

   KPI
========================================================= */

.kpis{
 display:grid;
 grid-template-columns:repeat(6,1fr);
 gap:12px;
 margin-bottom:12px

.kpi{

 padding:14px;

.kpi.red{

}

.kpi.purple{

}

.kpi-title{

}

.kpi-value{

}

.kpi-sub{

/* =========================================================

========================================================= */

.grid{

.card{

.card h2{

}

.chart{

 height:315px
}

.chart.tall{
 height:420px
}

.table-card{

.table-scroll{
 width:100%;
 overflow-x:auto
}

table{

 font-size:10px
}

thead th{
 background:var(--navy);
 color:#fff;
 padding:8px;
 white-space:nowrap;
 text-align:right

thead th:first-child{

tbody td{

tbody td:first-child{

}

tbody tr:nth-child(even){

tbody tr:hover{

}

.total-row{

}

.good{
 color:var(--green);
 font-weight:900
}

.bad{

 font-weight:900
}

/* =========================================================

========================================================= */

.tipo-controls{

 align-items:center;

 margin:14px 0 17px;

.tipo-filter-block{

 gap:9px

.date-controls,

.date-controls label{

.date-controls input{

.payment-buttons button{

 border-radius:6px;

 padding:0 14px;

 font-size:10px;

.payment-buttons button.active{

/* =========================================================

.empty{

.alert{

 margin-bottom:7px;
 font-size:11px
}

.alert.green{

.alert.yellow{

/* =========================================================

</style>

<script>
"use strict";

/* =========================================================
   CONFIGURACIÓN GITHUB
========================================================= */

/*
   IMPORTANTE:

   index.html
   maf_2_v5.xlsx

   deben estar en la misma carpeta del repositorio.

   Si posteriormente cambias el nombre del Excel,
   solamente modifica EXCEL_FILE.
*/

const EXCEL_FILE = "./maf_2_v5.xlsx";


/* =========================================================
   ESTADO
========================================================= */

let DATA = [];
let HEADERS = [];
let COL = {};
let CHARTS = {};

let selectedAsesores = new Set();
let selectedEstados = new Set();

let tipoFechaDesde = "";
let tipoFechaHasta = "";
let tipoPagoFiltro = "TODOS";


const ORDEN_CICLO = [
 "04",
 "11",
 "18",
 "25"
];

const ORDEN_TRAMO = [
 "PREVENTIVO",
 "TRAMO 1",
 "TRAMO 2",
 "TRAMO 3"
];

const ORDEN_TIPO = [
 "NORMAL",
 "TAXI",
 "BIGTICKET",
 "BALON",
 "1RA4TA5TA",
 "TOP"
];


/* =========================================================
   UTILIDADES
========================================================= */

function normalizar(v){

 return String(v ?? "")
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .replace(/[^A-Za-z0-9]/g,"")
  .toUpperCase();

}


function texto(v){

 return v == null
  ? ""
  : String(v).trim();

}


function numero(v){

 if(v == null || v === "")
  return 0;

 if(typeof v === "number")
  return Number.isFinite(v) ? v : 0;

 let s = String(v)
  .trim()
  .replace(/\s/g,"")
  .replace(/[$€£]/g,"");

 if(
  s.includes(",") &&
  s.includes(".")
 ){

  if(
   s.lastIndexOf(",") >
   s.lastIndexOf(".")
  ){

   s = s
    .replace(/\./g,"")
    .replace(",",".")
   ;

  }else{

   s = s.replace(/,/g,"");

  }

 }else if(
  s.includes(",")
 ){

  s = s.replace(",",".");
 }

 const n = Number(s);

 return Number.isFinite(n)
  ? n
  : 0;

}


function entero(v){

 return new Intl.NumberFormat(
  "es-PE",
  {
   maximumFractionDigits:0
  }
 ).format(numero(v));

}


function dinero(v){

 return "$" +
 new Intl.NumberFormat(
  "en-US",
  {
   minimumFractionDigits:2,
   maximumFractionDigits:2
  }
 ).format(numero(v));

}


function porcentaje(v){

 return numero(v).toFixed(1) + "%";

}


function escapeHTML(v){

 return String(v ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================================================
   COLUMNAS
========================================================= */

function valorColumna(row,indice){

 if(
  indice === undefined ||
  indice === null ||
  indice < 0
 )
  return "";

 const nombre = HEADERS[indice];

 return nombre
  ? row[nombre]
  : "";

}


function buscarColumna(nombres){

 const buscadas =
  nombres.map(normalizar);

 let i =
  HEADERS.findIndex(
   h => buscadas.includes(normalizar(h))
  );

 if(i >= 0)
  return i;

 return HEADERS.findIndex(
  h => {

   const x = normalizar(h);

   return buscadas.some(
    b =>
     x.includes(b) ||
     b.includes(x)
   );

  }
 );

}


function construirMapa(){

 COL.MES =
  buscarColumna(["MES"]);

 COL.CICLO =
  buscarColumna(["CICLO2"]);

 COL.TRAMO =
  buscarColumna(["TRAMO_CARTERA"]);

 COL.ASESOR =
  buscarColumna(["ASESOR_ASIGN"]);

 COL.SBS =
  buscarColumna(["CALIFICACION_SBS"]);

 COL.PAGO =
  buscarColumna(["RESPP"]);

 COL.ESTADO =
  buscarColumna(["ESTADO"]);

 COL.FREQ =
  buscarColumna(["CANT_VECES_PAGO_HIS"]);

 COL.TIPO =
  buscarColumna(["TIPO_CUOTA"]);

 COL.OP =
  buscarColumna(["OPERACION"]);

 COL.SOCIO =
  buscarColumna([
   "UNICO SOCIO",
   "UNICO_SOCIO"
  ]);

 COL.CARTERA =
  buscarColumna([
   "CUOTA_DOLARIZADA"
  ]);

 COL.RECUPERADO =
  buscarColumna([
   "MONTO_PAGO_DOLARIZADO"
  ]);

 COL.FECHA_GESTION =
  buscarColumna([
   "FECHA_GESTION"
  ]);

 COL.GEST_CALL =
  buscarColumna([
   "CANT_GEST_CALL"
  ]);

 COL.PROMESA_CALL =
  buscarColumna([
   "CANT_PROMESA_CALL"
  ]);

 COL.CONTAC_CALL =
  buscarColumna([
   "CANT_CONTAC_CALL"
  ]);

 COL.GEST_IVR =
  buscarColumna([
   "CANT_GEST_IVR"
  ]);

 COL.GEST_EMAIL =
  buscarColumna([
   "CANT_GEST_EMAIL"
  ]);

 COL.GEST_SMS =
  buscarColumna([
   "CANT_GEST_SMS"
  ]);

 COL.FLAG_SEGUIMIENTO =
  buscarColumna([
   "FLAG_SEGUIMIENTO"
  ]);

 COL.FLAG_PROMESA =
  buscarColumna([
   "FLAG_PROMESA"
  ]);

 COL.CONTACTO =
  buscarColumna([
   "CONTACTO"
  ]);

 COL.SIN_PAGO =
  buscarColumna([
   "SIN PAGO",
   "SIN_PAGO"
  ]);

}


function valorCampo(row,campo){

 switch(campo){

  case "MES":
   return texto(
    valorColumna(row,COL.MES)
   );

  case "CICLO":
   return texto(
    valorColumna(row,COL.CICLO)
   ).padStart(2,"0");

  case "TRAMO":
   return texto(
    valorColumna(row,COL.TRAMO)
   ).toUpperCase();

  case "ASESOR":
   return texto(
    valorColumna(row,COL.ASESOR)
   );

  case "SBS":
   return texto(
    valorColumna(row,COL.SBS)
   );

  case "TIPO":
   return texto(
    valorColumna(row,COL.TIPO)
   ).toUpperCase();

  case "PAGO":

   return numero(
    valorColumna(
     row,
     COL.RECUPERADO
    )
   ) > 0
    ? "CON PAGO"
    : "SIN PAGO";

  case "ESTADO":
   return texto(
    valorColumna(row,COL.ESTADO)
   );

  case "FREQ":
   return String(
    numero(
     valorColumna(
      row,
      COL.FREQ
     )
    )
   );

  default:
   return "";
 }

}


/* =========================================================
   FECHAS
========================================================= */

function fechaNormalizada(v){

 if(v == null || v === "")
  return null;

 if(
  v instanceof Date &&
  !isNaN(v)
 ){

  return new Date(
   v.getFullYear(),
   v.getMonth(),
   v.getDate()
  );

 }

 if(typeof v === "number"){

  const p =
   XLSX.SSF.parse_date_code(v);

  if(p){

   return new Date(
    p.y,
    p.m - 1,
    p.d
   );

  }

 }

 const s =
  String(v).trim();

 let m =
  s.match(
   /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/
  );

 if(m){

  return new Date(
   +m[3],
   +m[2] - 1,
   +m[1]
  );

 }

 m =
  s.match(
   /^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/
  );

 if(m){

  return new Date(
   +m[1],
   +m[2] - 1,
   +m[3]
  );

 }

 const d = new Date(s);

 return isNaN(d)
  ? null
  : new Date(
     d.getFullYear(),
     d.getMonth(),
     d.getDate()
    );

}

/* =========================================================
   MÉTRICAS
========================================================= */

function calcularMetricas(rows){

 let cartera = 0;
 let recuperado = 0;
 let qOperation = 0;
 let qUnico = 0;
 let qConPago = 0;
 let qSinPago = 0;

 let seguimientos = 0;
 let promesas = 0;
 let contactosDirectos = 0;


 rows.forEach(row=>{

  if(
   texto(
    valorColumna(
     row,
     COL.OP
    )
   ) !== ""
  )
   qOperation++;

  qUnico += numero(
   valorColumna(
    row,
    COL.SOCIO
   )
  );

  cartera += numero(
   valorColumna(
    row,
    COL.CARTERA
   )
  );

  const pago =
   numero(
    valorColumna(
     row,
     COL.RECUPERADO
    )
   );

  recuperado += pago;

  if(pago > 0)
   qConPago++;
  else
   qSinPago++;

  seguimientos += numero(
   valorColumna(
    row,
    COL.FLAG_SEGUIMIENTO
   )
  );

  promesas += numero(
   valorColumna(
    row,
    COL.FLAG_PROMESA
   )
  );

  contactosDirectos += numero(
   valorColumna(
    row,
    COL.CONTACTO
   )
  );

 });


 return {

  cartera,
  recuperado,
  saldo:cartera-recuperado,

  qOperation,
  qUnico,

  qConPago,
  qSinPago,

  seguimientos,
  promesas,
  contactosDirectos,

  porcentajeRecuperacion:
   cartera > 0
    ? recuperado / cartera * 100
    : 0,

  porcentajeContactoDirecto:
   qOperation > 0
    ? contactosDirectos / qOperation * 100
    : 0

 };

}


/* =========================================================
   PRODUCTIVIDAD / INTENSIDAD
========================================================= */

function calcularProductividadTipo(rows){

 let cobertura = 0;

 let promesa = 0;
 let contacto = 0;
 let ivr = 0;
 let email = 0;
 let sms = 0;

 let operaciones = 0;


 rows.forEach(row=>{

  if(
   texto(
    valorColumna(
     row,
     COL.OP
    )
   ) !== ""
  )
   operaciones++;

  cobertura += numero(
   valorColumna(
    row,
    COL.GEST_CALL
   )
  );

  promesa += numero(
   valorColumna(
    row,
    COL.PROMESA_CALL
   )
  );

  contacto += numero(
   valorColumna(
    row,
    COL.CONTAC_CALL
   )
  );

  ivr += numero(
   valorColumna(
    row,
    COL.GEST_IVR
   )
  );

  email += numero(
   valorColumna(
    row,
    COL.GEST_EMAIL
   )
  );

  sms += numero(
   valorColumna(
    row,
    COL.GEST_SMS
   )
  );

 });


 /*
  =========================================================
  INTENSIDAD MARCADOR

  CANT_GEST_CALL / Q_OPERATION
  =========================================================
 */

 const intensidadMarcador =
  operaciones > 0
   ? cobertura / operaciones
   : 0;


 /*
  =========================================================
  MARCADOR VARIOS

  PROMESA
  + CONTACTO
  + IVR
  + EMAIL
  + SMS

  todo dividido entre Q_OPERATION
  =========================================================
 */

 const varios =
  promesa +
  contacto +
  ivr +
  email +
  sms;


 const intensidadVarios =
  operaciones > 0
   ? varios / operaciones
   : 0;


 /*
  =========================================================
  INTENSIDAD GENERAL

  CANT_GEST_CALL
  +
  MARCADOR VARIOS

  dividido entre Q_OPERATION
  =========================================================
 */

 const intensidadGeneral =
  operaciones > 0
   ? (cobertura + varios) / operaciones
   : 0;


 return {

  cobertura,

  intensidadGeneral,

  intensidadMarcador,

  intensidadVarios,

  operaciones

 };

}


/* =========================================================
   AGRUPAR
========================================================= */

function agrupar(rows,campo){

 const map = new Map();

 rows.forEach(row=>{

  const key =
   valorCampo(row,campo);

  if(!map.has(key))
   map.set(key,[]);

  map.get(key).push(row);

 });

 return map;

}

function destruirChart(id){

 if(CHARTS[id]){

  try{
   CHARTS[id].destroy();
  }catch(e){}

  delete CHARTS[id];

 }

}


function etiquetaValor(v,formato){

 if(formato === "dinero")
  return dinero(v);

 if(formato === "porcentaje")
  return porcentaje(v);

 return entero(v);

}


function graficoBarras(
 id,
 labels,
 datasets,
 formato="numero"
){

 destruirChart(id);

 const canvas =
  document.getElementById(id);

 if(!canvas)
  return;


 CHARTS[id] =
  new Chart(
   canvas,
   {
    type:"bar",

    data:{
     labels,
     datasets
    },

    plugins:[
     ChartDataLabels
    ],

    options:{

     responsive:true,
     maintainAspectRatio:false,

     layout:{
      padding:{
       top:30,
       right:10,
       left:5,
       bottom:5
      }
     },

     plugins:{

      legend:{
       display:true,
       position:"top"
      },

      datalabels:{
       display:true,
       anchor:"end",
       align:"top",
       offset:2,
       clamp:true,
       clip:false,

       font:{
        size:9,
        weight:"800"
       },

       formatter:v =>
        etiquetaValor(
         v,
         formato
        )
      }

     },

     scales:{

      y:{
       beginAtZero:true,

       ticks:{
        callback:v =>
         etiquetaValor(
          v,
          formato
         )
       }

      }

     }

    }

   }
  );

}


function graficoDonut(
 id,
 labels,
 values
){

 destruirChart(id);

 const canvas =
  document.getElementById(id);

 if(!canvas)
  return;


 CHARTS[id] =
  new Chart(
   canvas,
   {

    type:"doughnut",

    data:{
     labels,

     datasets:[
      {
       data:values
      }
     ]
    },

    plugins:[
     ChartDataLabels
    ],

    options:{

     responsive:true,
     maintainAspectRatio:false,

     plugins:{

      legend:{
       position:"top"
      },

      datalabels:{

       font:{
        size:11,
        weight:"900"
       },

       formatter:(v,c)=>{

        const total =
         c.dataset.data.reduce(
          (a,b)=>a+b,
          0
         );

        return entero(v) +
         "\n" +
         (
          total
           ? v / total * 100
           : 0
         ).toFixed(1) +
         "%";

       }

      }

     }

    }

   }
  );

}

function obtenerFiltradosTipoCuota(rows){

  tipoFechaDesde
   ? new Date(

      "T00:00:00"
     )
   : null;


 const hasta =
  tipoFechaHasta
   ? new Date(
      tipoFechaHasta +
      "T23:59:59"
     )
   : null;


 return rows.filter(row=>{

  if(desde || hasta){

   const f =
    fechaNormalizada(
     valorColumna(
      row,
      COL.FECHA_GESTION
     )
    );

   if(!f)
    return false;

   if(
    desde &&
    f < desde
   )
    return false;

   if(
    hasta &&
    f > hasta
   )
    return false;

  }


  const pago =
   numero(
    valorColumna(
     row,
     COL.RECUPERADO
    )
   );


  if(
   tipoPagoFiltro === "CON PAGO" &&
   pago <= 0
  )
   return false;


  if(
   tipoPagoFiltro === "SIN PAGO" &&
   pago > 0
  )
   return false;


  return true;

 });

}

function renderRecupero(rows){

  calcularMetricas(rows);


 const gruposTipo =
  agrupar(rows,"TIPO");

  [...gruposTipo.keys()]
   .filter(Boolean)
   .sort((a,b)=>{

    const ia =
     ORDEN_TIPO.indexOf(a);

    const ib =
     ORDEN_TIPO.indexOf(b);

    if(
     ia >= 0 &&
     ib >= 0
    )
     return ia - ib;

    if(ia >= 0)
     return -1;

    if(ib >= 0)
     return 1;

    return a.localeCompare(
     b,
     "es"
    );

   });


 /*

 document.getElementById(
  "recupero"

 construirKPIs(m) +

 `

/* =========================================================

========================================================= */

function llenarFiltro(
 id,
 valores,
 orden=[]
){

 const select =
  document.getElementById(id);


 const unicos =
  [
   ...new Set(
    valores.filter(
     x => x !== ""
    )
   )
  ];


 let lista;


 if(orden.length){

  lista =
   orden.filter(
    x =>
     unicos.includes(x)
   );


  unicos.forEach(x=>{

   if(!lista.includes(x))
    lista.push(x);

  });

 }else{

  lista =
   unicos.sort(
    (a,b) =>
     String(a)
      .localeCompare(
       String(b),
       "es"
      )
   );

 }


 select.innerHTML =
  '<option value="__ALL__">Todos</option>' +

  lista.map(
   x =>
    `<option value="${escapeHTML(x)}">
      ${escapeHTML(x)}
     </option>`
  ).join("");

}

  )
  .filter(
   ([,i]) =>
    i === undefined ||
    i === null ||
    i < 0
  )
  .map(
   ([n]) => n
  );


 if(
  faltantes.length
 ){

  throw new Error(
   "Faltan columnas obligatorias: " +
   faltantes.join(", ")
  );

 }

}


/* =========================================================
   PROCESAR BUFFER
========================================================= */

async function procesarBuffer(
 buffer,
 nombreArchivo
){

 const status =
  document.getElementById(
   "status"
  );


 try{

  status.className =
   "status loading";

  status.textContent =
   "Procesando " +
   nombreArchivo +
   "...";


  const wb =
   XLSX.read(
    buffer,
    {
     type:"array",
     cellDates:true,
     cellNF:false,
     cellText:false
    }
   );


  /*
   Buscar primero la hoja exacta.
  */

  const hoja =
   wb.SheetNames.find(
    n =>
     normalizar(n) ===
     "MAFEVALUACION"
   ) ||

   wb.SheetNames.find(
    n =>
     normalizar(n)
      .includes(
       "MAFEVALUACION"
      )
   );


  if(!hoja){

   throw new Error(
    "No se encontró la hoja " +
    "'MAF Evaluacion'. Hojas disponibles: " +
    wb.SheetNames.join(", ")
   );

  }


  DATA =
   XLSX.utils.sheet_to_json(
    wb.Sheets[hoja],
    {
     defval:"",
     raw:true,
     blankrows:false
    }
   );


  if(!DATA.length){

   throw new Error(
    "La hoja MAF Evaluacion " +
    "no contiene registros."
   );

  }


  HEADERS =
   Object.keys(
    DATA[0]
   );


  construirMapa();


  validarColumnas();


  /*
   Reiniciar selecciones
   cuando se carga un nuevo archivo.
  */

  selectedAsesores.clear();
  selectedEstados.clear();

  tipoFechaDesde = "";
  tipoFechaHasta = "";
  tipoPagoFiltro = "TODOS";


  cargarFiltros();


  document.getElementById(
   "fileName"
  ).textContent =
   nombreArchivo;


  status.className =
   "status";


  status.innerHTML =
   "Archivo cargado correctamente. " +
   "<b>" +
   entero(DATA.length) +
   "</b> registros.";


  render();


  console.log(
   "MAF / RECUPERO v8.0",
   {
    hoja,
    archivo:nombreArchivo,
    registros:DATA.length,
    columnas:HEADERS.length,
    headers:HEADERS,
    mapa:COL,
    primerRegistro:DATA[0]
   }
  );


 }catch(err){

  DATA = [];

  status.className =
   "status error";

  status.textContent =
   "Error al cargar el archivo: " +
   err.message;

  console.error(
   "Error MAF / RECUPERO:",
   err
  );

 }

}


/* =========================================================
   CARGAR ARCHIVO MANUAL
========================================================= */

async function cargarArchivoManual(
 archivo
){

 if(!archivo)
  return;


 const buffer =
  await archivo.arrayBuffer();


 await procesarBuffer(
  buffer,
  archivo.name
 );


}


/* =========================================================
   CARGA AUTOMÁTICA DESDE GITHUB
========================================================= */

async function cargarExcelAutomatico(){

 const status =
  document.getElementById(
   "status"
  );


 const fileName =
  document.getElementById(
   "fileName"
  );


 try{

  status.className =
   "status loading";

  status.innerHTML =
   "Cargando automáticamente " +
   "<b>maf_2_v5.xlsx</b> desde el repositorio...";


  fileName.textContent =
   "Carga automática...";


  /*
   IMPORTANTE:

   El parámetro ?v=Date.now()
   evita utilizar una copia
   antigua almacenada en caché.
  */

  const url =
   EXCEL_FILE +
   "?v=" +
   Date.now();


  const response =
   await fetch(
    url,
    {
     cache:"no-store"
    }
   );


  if(!response.ok){

   throw new Error(
    "No se pudo descargar " +
    EXCEL_FILE +
    ". Código HTTP: " +
    response.status
   );

  }


  const buffer =
   await response.arrayBuffer();


  await procesarBuffer(
   buffer,
   "maf_2_v5.xlsx"
  );


 }catch(err){

  DATA = [];

  status.className =
   "status error";

  status.innerHTML =

   "No se pudo cargar automáticamente " +
   "<b>maf_2_v5.xlsx</b>. " +

   "<br><br>" +

   "Verifica que el archivo esté en la " +
   "misma carpeta que index.html " +
   "dentro de GitHub. " +

   "<br><br>" +

   "También puedes utilizar " +
   "el botón <b>Seleccionar archivo</b> " +
   "para cargarlo manualmente.";


  fileName.textContent =
   "Archivo no cargado";


  console.error(
   "Carga automática:",
   err
  );

 }

}
